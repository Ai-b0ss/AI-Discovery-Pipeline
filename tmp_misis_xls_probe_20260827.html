<!doctype html><meta charset="utf-8"><title>MISIS XLS probe</title>
<style>body{font:11px/1.22 ui-monospace,SFMono-Regular,Consolas,monospace;margin:10px;background:#fff;color:#111}pre{white-space:pre-wrap;word-break:break-word;margin:0}.err{color:#900}</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<pre id="out">LOADING…</pre>
<script>
(()=>{const out=document.getElementById('out'), p=new URLSearchParams(location.search), log=[];
try{
 const target='https://misis.ru/files/-/504f0d5daceff524b3076082666fa485/itkn-260826.xls';
 const urls=[['allorigins','https://api.allorigins.win/raw?url='+encodeURIComponent(target)],['corsproxy','https://corsproxy.io/?url='+encodeURIComponent(target)]];
 let buf=null,used='';
 for(const [name,url] of urls){try{log.push('SYNC FETCH '+name+' …');out.textContent=log.join('\n');const x=new XMLHttpRequest();x.open('GET',url,false);x.responseType='arraybuffer';x.send(null);const b=x.response;const u=b?new Uint8Array(b):new Uint8Array();const magic=Array.from(u.slice(0,16)).map(v=>v.toString(16).padStart(2,'0')).join('');log.push(`${name}: HTTP ${x.status}, ${u.length} bytes, magic ${magic}`);if(x.status>=200&&x.status<300&&u.length>1000&&u[0]!==0x3c){buf=b;used=name;break}}catch(e){log.push(name+': ERROR '+e)}}
 if(!buf)throw new Error('NO_BINARY_XLS\n'+log.join('\n'));
 const wb=XLSX.read(buf,{type:'array'});log.push('PARSED via '+used);log.push('SHEETS '+wb.SheetNames.join(' | '));
 const clean=v=>v==null?'':String(v).replace(/\s+/g,' ').trim();
 function val(ws,r,c){let q=ws[XLSX.utils.encode_cell({r,c})];if(q&&q.v!=null)return clean(q.v);for(const m of(ws['!merges']||[]))if(r>=m.s.r&&r<=m.e.r&&c>=m.s.c&&c<=m.e.c){q=ws[XLSX.utils.encode_cell(m.s)];if(q&&q.v!=null)return clean(q.v)}return''}
 const hits=[];for(const sn of wb.SheetNames){const ws=wb.Sheets[sn];if(!ws['!ref'])continue;const rg=XLSX.utils.decode_range(ws['!ref']);for(let r=rg.s.r;r<=rg.e.r;r++)for(let c=rg.s.c;c<=rg.e.c;c++){const v=val(ws,r,c);if(/ББИ[\s\-–—]*26(?:[\s\-–—]*\d+)?/i.test(v))hits.push({sn,r,c,v})}}
 const uniq=[],seen=new Set();for(const h of hits){const k=h.sn+'|'+h.r+'|'+h.c+'|'+h.v;if(!seen.has(k)){seen.add(k);uniq.push(h)}}
 log.push('HITS '+uniq.length);uniq.forEach((h,i)=>log.push(`${i}: ${h.sn}!${XLSX.utils.encode_cell({r:h.r,c:h.c})} = ${h.v}`));
 const group=p.get('group');let lines=[];
 if(!group)lines=log;else{const gh=uniq.filter(h=>h.v.toUpperCase().includes(group.toUpperCase()));lines.push('GROUP '+group+' MATCHES '+gh.length);for(const h of gh){const ws=wb.Sheets[h.sn],rg=XLSX.utils.decode_range(ws['!ref']);lines.push(`--- ${h.sn}!${XLSX.utils.encode_cell({r:h.r,c:h.c})} ${h.v} ---`);for(let r=rg.s.r;r<=rg.e.r;r++){const near=[h.c-2,h.c-1,h.c,h.c+1,h.c+2].filter(c=>c>=rg.s.c&&c<=rg.e.c);if(!near.some(c=>val(ws,r,c)))continue;const cols=[0,1,2,3,...near],parts=[];for(const c of[...new Set(cols)]){const v=val(ws,r,c);if(v)parts.push(XLSX.utils.encode_col(c)+'='+v)}if(parts.length)lines.push('R'+(r+1)+' '+parts.join(' || '))}}}
 const page=Math.max(0,+p.get('page')||0),per=58,start=page*per;out.textContent=lines.slice(start,start+per).concat([``,`PAGE ${page} lines ${start+1}-${Math.min(start+per,lines.length)} / ${lines.length}`]).join('\n');
}catch(e){out.innerHTML='<span class="err">FAIL\n'+String(e&&e.stack||e).replace(/</g,'&lt;')+'</span>'}})();
</script>
