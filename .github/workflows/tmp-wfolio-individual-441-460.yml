          '5J3B9162.jpg':'d0c59bb78ea925152d67c726d3c011f7053cd2bff0e4390831e534572ef582f5'}
          with zipfile.ZipFile(pack) as z:
              bybase={os.path.basename(i.filename):i for i in z.infolist() if not i.is_dir()}
              for name,sha in want.items():
                  info=bybase[name]
                  data=z.read(info)
                  got=hashlib.sha256(data).hexdigest()
                  if got!=sha: raise SystemExit(f'SHA mismatch {name}: {got}')
                  open('out/'+name,'wb').write(data)
                  print('OK',name,len(data),got)
          PY
