  push:
    branches: [tmp/yandex-drive-transfer-20260828]
    paths: [tmp-wfolio-individual-441-460-trigger.txt]

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download restore pack and extract verified JPEGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl out
          gh run download 33309118687 -R "$GITHUB_REPOSITORY" -n 'wfolio-remain-pack001.zip' -D dl
          PACK=$(find dl -type f -name '*.zip' | head -n1)
          test -n "$PACK"
          python - "$PACK" <<'PY'
          import sys,zipfile,hashlib,os
          pack=sys.argv[1]
          want={
          '5J3B9134.jpg':'a21c023e3f3d87db6c6c7ab32328f1f69f7be149f2cba1fe8323cdfb32124328',
