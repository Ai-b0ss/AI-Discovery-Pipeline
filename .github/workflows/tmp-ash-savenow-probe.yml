name: TEMP a-Shell transport probe

on:
  pull_request:
    paths:
      - '.free-fabric/ash-probe/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Litterbox resumable transport
        shell: /usr/bin/dash {0}
        run: |
          set -eu
          dd if=/dev/zero of=sample.bin bs=1M count=5 status=none
          URL=$(curl -fsS --connect-timeout 15 --max-time 90 --retry 2 --retry-delay 2 \
            -F reqtype=fileupload -F time=1h -F 'fileToUpload=@sample.bin' \
            https://litterbox.catbox.moe/resources/internals/api.php | tr -d '\r\n')
          test -n "$URL"
          echo "LITTERBOX_URL=$URL"
          curl -fsSL --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 2 \
            -r 100-199 -D headers.bin -o range.bin "$URL"
          test "$(wc -c < range.bin)" -eq 100
          python3 - headers.bin <<'PY'
          import re,sys
          s=open(sys.argv[1],'rb').read().decode('latin1','ignore')
          if not re.search(r'(?im)^Content-Range:\s*bytes\s+100-199/\d+\s*$',s):
              raise SystemExit('LITTERBOX: no valid Content-Range')
          print('LITTERBOX_RANGE_OK')
          PY
