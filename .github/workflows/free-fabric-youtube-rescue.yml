name: FREE FABRIC YouTube Rescue

on:
  pull_request:
    paths:
      - '.free-fabric/youtube-rescue/**'

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and download via Piped APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APIS=(
            'https://pipedapi.kavin.rocks'
            'https://pipedapi.tokhmi.xyz'
            'https://pipedapi.moomoo.me'
            'https://pipedapi.syncpundit.io'
            'https://api-piped.mha.fi'
            'https://piped-api.garudalinux.org'
          )
          : > out/piped_attempts.txt
          SUCCESS=0

          for API in "${APIS[@]}"; do
            echo "trying $API" | tee -a out/piped_attempts.txt
            META=/tmp/piped.json
            rm -f "$META"
            CODE=$(curl -sS -L --connect-timeout 8 --max-time 35 -o "$META" -w '%{http_code}' \
              "$API/streams/BUN1qw0yH6M" || true)
            VS=$(jq -r '.videoStreams | length // 0' "$META" 2>/dev/null || echo 0)
            AS=$(jq -r '.audioStreams | length // 0' "$META" 2>/dev/null || echo 0)
            TITLE=$(jq -r '.title // empty' "$META" 2>/dev/null || true)
            echo "http=$CODE videoStreams=$VS audioStreams=$AS title=$TITLE" | tee -a out/piped_attempts.txt
            [[ "$VS" =~ ^[0-9]+$ ]] || VS=0
            [[ "$AS" =~ ^[0-9]+$ ]] || AS=0
            if (( VS < 1 )); then continue; fi

            VIDEO_URL=$(jq -r '[.videoStreams[] | select(.url != null and (.height // 0) <= 1080)] | sort_by(.height // 0, .bitrate // 0) | reverse | .[0].url // empty' "$META")
            VIDEO_ONLY=$(jq -r '[.videoStreams[] | select(.url != null and (.height // 0) <= 1080)] | sort_by(.height // 0, .bitrate // 0) | reverse | .[0].videoOnly // true' "$META")
            AUDIO_URL=$(jq -r '[.audioStreams[] | select(.url != null)] | sort_by(.bitrate // 0) | reverse | .[0].url // empty' "$META")
            HEIGHT=$(jq -r '[.videoStreams[] | select(.url != null and (.height // 0) <= 1080)] | sort_by(.height // 0, .bitrate // 0) | reverse | .[0].height // 0' "$META")
            echo "selected_height=$HEIGHT videoOnly=$VIDEO_ONLY" | tee -a out/piped_attempts.txt
            test -n "$VIDEO_URL" || continue

            rm -f /tmp/video.part /tmp/audio.part out/BUN1qw0yH6M.mp4
            if ! curl -fL --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 600 \
                 -A 'Mozilla/5.0' "$VIDEO_URL" -o /tmp/video.part; then
              continue
            fi

            if [[ "$VIDEO_ONLY" == "false" ]]; then
              cp /tmp/video.part out/BUN1qw0yH6M.mp4
            else
              test -n "$AUDIO_URL" || continue
              if ! curl -fL --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 600 \
                   -A 'Mozilla/5.0' "$AUDIO_URL" -o /tmp/audio.part; then
                continue
              fi
              ffmpeg -y -v warning -i /tmp/video.part -i /tmp/audio.part -map 0:v:0 -map 1:a:0 -c copy -movflags +faststart out/BUN1qw0yH6M.mp4
            fi

            cp "$META" out/piped_metadata.json
            echo "selected_api=$API" | tee -a out/piped_attempts.txt
            SUCCESS=1
            break
          done
          test "$SUCCESS" -eq 1

      - name: Verify media
        shell: bash
        run: |
          set -euo pipefail
          FILE='out/BUN1qw0yH6M.mp4'
          test -s "$FILE"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -of json "$FILE" | tee out/ffprobe.json
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$FILE")
          AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$FILE")
          test -n "$HEIGHT"
          test -n "$AUDIO"
          echo "height=$HEIGHT audio=$AUDIO" | tee out/quality.txt
          sha256sum "$FILE" | tee out/SHA256SUMS.txt
          stat -c 'bytes=%s' "$FILE" | tee -a out/quality.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: youtube-BUN1qw0yH6M
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
