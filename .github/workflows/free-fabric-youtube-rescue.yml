name: FREE FABRIC YouTube Rescue

on:
  pull_request:
    paths:
      - '.free-fabric/youtube-rescue/**'

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22 for yt-dlp EJS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install current yt-dlp with EJS
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'yt-dlp[default]'
          node --version
          yt-dlp --version

      - name: Download with supported logged-out player clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://youtu.be/BUN1qw0yH6M'
          : > out/ytdlp_attempts.txt
          SUCCESS=0

          CLIENTS=('default' 'web_embedded' 'tv_simply' 'visionos' 'ios' 'android_vr')
          for CLIENT in "${CLIENTS[@]}"; do
            echo "trying client=$CLIENT" | tee -a out/ytdlp_attempts.txt
            rm -f out/BUN1qw0yH6M.* /tmp/ytdlp.log
            set +e
            yt-dlp -v \
              --js-runtimes node \
              --remote-components ejs:github \
              --extractor-args "youtube:player_client=$CLIENT" \
              --no-playlist \
              --merge-output-format mp4 \
              --remux-video mp4 \
              -f 'bv*[height<=1080][vcodec^=avc1]+ba[ext=m4a]/b[height<=1080][ext=mp4]/b[height<=1080]/best' \
              -o 'out/BUN1qw0yH6M.%(ext)s' \
              "$URL" 2>&1 | tee /tmp/ytdlp.log
            RC=${PIPESTATUS[0]}
            set -e
            echo "client=$CLIENT rc=$RC" | tee -a out/ytdlp_attempts.txt
            tail -n 25 /tmp/ytdlp.log >> out/ytdlp_attempts.txt || true
            FILE=$(find out -maxdepth 1 -type f -name 'BUN1qw0yH6M*.mp4' -size +100k | head -n1 || true)
            if [[ "$RC" == "0" && -n "$FILE" ]]; then
              mv "$FILE" out/BUN1qw0yH6M.mp4
              echo "selected_client=$CLIENT" | tee -a out/ytdlp_attempts.txt
              SUCCESS=1
              break
            fi
          done
          test "$SUCCESS" -eq 1

      - name: Verify media
        shell: bash
        run: |
          set -euo pipefail
          FILE='out/BUN1qw0yH6M.mp4'
          test -s "$FILE"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,duration -show_entries format=duration -of json "$FILE" | tee out/ffprobe.json
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$FILE")
          AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$FILE")
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$FILE")
          test -n "$HEIGHT"
          test -n "$AUDIO"
          echo "height=$HEIGHT audio=$AUDIO duration=$DURATION" | tee out/quality.txt
          sha256sum "$FILE" | tee out/SHA256SUMS.txt
          stat -c 'bytes=%s' "$FILE" | tee -a out/quality.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: youtube-BUN1qw0yH6M
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
