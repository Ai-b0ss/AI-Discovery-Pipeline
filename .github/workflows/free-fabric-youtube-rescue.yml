name: FREE FABRIC YouTube Rescue

on:
  pull_request:
    paths:
      - '.free-fabric/youtube-rescue/**'

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and download via trusted Invidious APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          INSTANCES=(
            'https://inv.nadeko.net'
            'https://invidious.nerdvpn.de'
            'https://yt.chocolatemoo53.com'
            'https://invidious.tiekoetter.com'
            'https://invidious.f5.si'
          )
          : > out/invidious_attempts.txt
          SUCCESS=0

          for IV in "${INSTANCES[@]}"; do
            echo "trying $IV" | tee -a out/invidious_attempts.txt
            META=/tmp/invidious.json
            rm -f "$META"
            CODE=$(curl -sS -L --connect-timeout 8 --max-time 40 -o "$META" -w '%{http_code}' \
              "$IV/api/v1/videos/BUN1qw0yH6M?local=true" || true)
            TITLE=$(jq -r '.title // empty' "$META" 2>/dev/null || true)
            FS=$(jq -r '.formatStreams | length // 0' "$META" 2>/dev/null || echo 0)
            AD=$(jq -r '.adaptiveFormats | length // 0' "$META" 2>/dev/null || echo 0)
            echo "http=$CODE formatStreams=$FS adaptive=$AD title=$TITLE" | tee -a out/invidious_attempts.txt
            [[ "$FS" =~ ^[0-9]+$ ]] || FS=0

            if (( FS > 0 )); then
              URL=$(jq -r '[.formatStreams[] | select(.url != null)] | sort_by((.height // 0), (.bitrate // 0)) | reverse | .[0].url // empty' "$META")
              QUALITY=$(jq -r '[.formatStreams[] | select(.url != null)] | sort_by((.height // 0), (.bitrate // 0)) | reverse | .[0].qualityLabel // .[0].quality // empty' "$META")
              echo "muxed_quality=$QUALITY" | tee -a out/invidious_attempts.txt
              if [[ -n "$URL" ]] && curl -fL --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 600 \
                    -A 'Mozilla/5.0' "$URL" -o out/BUN1qw0yH6M.mp4; then
                cp "$META" out/invidious_metadata.json
                echo "selected_instance=$IV" | tee -a out/invidious_attempts.txt
                SUCCESS=1
                break
              fi
            fi
          done
          test "$SUCCESS" -eq 1

      - name: Verify media
        shell: bash
        run: |
          set -euo pipefail
          FILE='out/BUN1qw0yH6M.mp4'
          test -s "$FILE"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -of json "$FILE" | tee out/ffprobe.json
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$FILE")
          AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$FILE")
          test -n "$HEIGHT"
          test -n "$AUDIO"
          echo "height=$HEIGHT audio=$AUDIO" | tee out/quality.txt
          sha256sum "$FILE" | tee out/SHA256SUMS.txt
          stat -c 'bytes=%s' "$FILE" | tee -a out/quality.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: youtube-BUN1qw0yH6M
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
