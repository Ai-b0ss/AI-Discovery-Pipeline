name: tmp-misis-g2-september-20260830
on:
  push:
    paths:
      - '.github/workflows/tmp-misis-g2-september-20260830.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Parse BBI-26-6-2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q xlrd==2.0.1
          python3 - <<'PY'
          import urllib.request, xlrd, hashlib
          from pathlib import Path
          url='https://misis.ru/files/-/504f0d5daceff524b3076082666fa485/itkn-260826.xls'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://misis.ru/students/'})
          with urllib.request.urlopen(req,timeout=90) as r:data=r.read()
          print('SHA',hashlib.sha256(data).hexdigest())
          p=Path('/tmp/x.xls'); p.write_bytes(data)
          b=xlrd.open_workbook(str(p),formatting_info=True); s=b.sheet_by_name('1 курс')
          def txt(r,c):
              v=s.cell_value(r,c)
              if isinstance(v,float) and v.is_integer(): v=int(v)
              return str(v).replace('\r',' / ').replace('\n',' / ').strip() if v!='' else ''
          c0=None
          for c in range(s.ncols):
              if txt(0,c)=='ББИ-26-6-2': c0=c; break
          print('COL',c0,'SUBHEADS',[txt(1,c0+i) for i in range(4)])
          days=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС']; starts=[2,16,30,44,58,72,86]
          times={1:'09:00-10:35',2:'10:50-12:25',3:'12:40-14:15',4:'14:30-16:05',5:'16:20-17:55',6:'18:00-19:25',7:'19:35-21:00'}
          for cyc,off in [('A_UPPER',0),('B_LOWER',1)]:
              print('===',cyc,'===')
              for sg in (1,2):
                  print('SUBGROUP',sg)
                  sc=c0+(sg-1)*2; rc=sc+1
                  for day,ds in zip(days,starts):
                      arr=[]
                      for pair in range(1,8):
                          r=ds+2*(pair-1)+off
                          sub=txt(r,sc); room=txt(r,rc)
                          if sub: arr.append(f'{pair}|{times[pair]}|{sub}|{room}')
                      print(day, ' || '.join(arr) if arr else '-')
          PY
