name: tmp-misis-bbi26-flow-average-20260828
on:
  push:
    paths:
      - '.github/workflows/tmp-misis-bbi26-flow-average-20260828.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Analyze all BBI-26-6 groups
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q xlrd==2.0.1
          python3 - <<'PY'
          import urllib.request,re,xlrd,statistics,collections,hashlib,json
          from pathlib import Path
          url='https://misis.ru/files/-/504f0d5daceff524b3076082666fa485/itkn-260826.xls'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Chrome/146 Safari/537.36','Referer':'https://misis.ru/students/','Accept':'application/vnd.ms-excel,*/*'})
          with urllib.request.urlopen(req,timeout=90) as r:data=r.read()
          print('SOURCE',len(data),hashlib.sha256(data).hexdigest())
          p=Path('/tmp/x.xls'); p.write_bytes(data)
          b=xlrd.open_workbook(str(p),formatting_info=True); s=b.sheet_by_name('1 курс')
          def txt(r,c):
              v=s.cell_value(r,c)
              if isinstance(v,float) and v.is_integer(): v=int(v)
              return str(v).replace('\r',' / ').replace('\n',' / ').strip() if v!='' else ''
          headers=[]
          for c in range(s.ncols):
              v=txt(0,c)
              m=re.fullmatch(r'ББИ-26-6-([1-7])',v)
              if m: headers.append((int(m.group(1)),c,v))
          headers.sort()
          print('HEADERS',headers)
          assert [g for g,_,_ in headers]==list(range(1,8)), headers
          days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс']
          day_starts=[2,16,30,44,58,72,86]
          times={1:('09:00','10:35'),2:('10:50','12:25'),3:('12:40','14:15'),4:('14:30','16:05'),5:('16:20','17:55'),6:('18:00','19:25'),7:('19:35','21:00')}
          schedules=[]
          for g,c0,name in headers:
              for sg in (1,2):
                  subj_col=c0+(sg-1)*2
                  room_col=subj_col+1
                  for cyc,roff in [('A',0),('B',1)]:
                      dmap={}
                      for di,ds in enumerate(day_starts):
                          slots=[]; detail=[]
                          for pair in range(1,8):
                              r=ds+2*(pair-1)+roff
                              sub=txt(r,subj_col); room=txt(r,room_col)
                              if sub:
                                  slots.append(pair); detail.append((pair,sub,room))
                          gaps=0
                          if slots:
                              gaps=sum(1 for p in range(min(slots),max(slots)+1) if p not in slots)
                          dmap[days[di]]={'slots':slots,'detail':detail,'gaps':gaps}
                      total=sum(len(v['slots']) for v in dmap.values())
                      total_gaps=sum(v['gaps'] for v in dmap.values())
                      active=sum(bool(v['slots']) for v in dmap.values())
                      starts=[min(v['slots']) for v in dmap.values() if v['slots']]
                      ends=[max(v['slots']) for v in dmap.values() if v['slots']]
                      schedules.append({'g':g,'sg':sg,'cyc':cyc,'days':dmap,'pairs':total,'gaps':total_gaps,'active':active,'starts':starts,'ends':ends})
          # Individual schedule-week summaries
          print('=== WEEK_SCHEDULES ===')
          for x in schedules:
              compact='; '.join(f"{d}:{','.join(map(str,x['days'][d]['slots'])) or '-'}" for d in days)
              print(f"G{x['g']} SG{x['sg']} {x['cyc']} pairs={x['pairs']} gaps={x['gaps']} active={x['active']} | {compact}")
          # Group averages across 2 subgroups x 2 cycles
          print('=== GROUP_STATS ===')
          for g in range(1,8):
              xs=[x for x in schedules if x['g']==g]
              print('GROUP',g,
                    'pairs_avg',round(statistics.mean(x['pairs'] for x in xs),2),
                    'pairs_range',(min(x['pairs'] for x in xs),max(x['pairs'] for x in xs)),
                    'gaps_avg',round(statistics.mean(x['gaps'] for x in xs),2),
                    'sat_weeks',sum(bool(x['days']['Сб']['slots']) for x in xs),'/4',
                    'sun_weeks',sum(bool(x['days']['Вс']['slots']) for x in xs),'/4',
                    'latest_pair',max(max(x['ends']) if x['ends'] else 0 for x in xs))
          # Aggregate over 28 student-weeks
          print('=== COHORT_AGG ===')
          print('student_weeks',len(schedules))
          print('pairs_week_mean',round(statistics.mean(x['pairs'] for x in schedules),3),'median',statistics.median(x['pairs'] for x in schedules),'range',(min(x['pairs'] for x in schedules),max(x['pairs'] for x in schedules)))
          print('gaps_week_mean',round(statistics.mean(x['gaps'] for x in schedules),3),'zero_gap_weeks',sum(x['gaps']==0 for x in schedules),'of',len(schedules),'max_gaps',max(x['gaps'] for x in schedules))
          print('active_days_mean',round(statistics.mean(x['active'] for x in schedules),3),'range',(min(x['active'] for x in schedules),max(x['active'] for x in schedules)))
          print('sat_student_weeks',sum(bool(x['days']['Сб']['slots']) for x in schedules),'of',len(schedules))
          print('sun_student_weeks',sum(bool(x['days']['Вс']['slots']) for x in schedules),'of',len(schedules))
          # Per weekday
          print('=== DAY_AGG ===')
          for d in days:
              vals=[]; startc=collections.Counter(); endc=collections.Counter(); gapc=collections.Counter(); empty=0
              for x in schedules:
                  sl=x['days'][d]['slots']; vals.append(len(sl)); gapc[x['days'][d]['gaps']]+=1
                  if sl: startc[min(sl)]+=1; endc[max(sl)]+=1
                  else: empty+=1
              print(d,'pairs_mean',round(statistics.mean(vals),3),'range',(min(vals),max(vals)),'empty',empty,'start_pairs',dict(sorted(startc.items())),'end_pairs',dict(sorted(endc.items())),'gaps',dict(sorted(gapc.items())))
          # Overall active-day start/end distribution weekdays only and all days
          active=[]
          for x in schedules:
              for d in days:
                  sl=x['days'][d]['slots']
                  if sl: active.append((d,min(sl),max(sl),len(sl),x['days'][d]['gaps']))
          sc=collections.Counter(a[1] for a in active); ec=collections.Counter(a[2] for a in active); pc=collections.Counter(a[3] for a in active)
          print('=== ACTIVE_DAY_DIST ===')
          print('count',len(active),'start_pair',dict(sorted(sc.items())),'end_pair',dict(sorted(ec.items())),'pairs_per_day',dict(sorted(pc.items())),'days_with_gap',sum(a[4]>0 for a in active))
          # Subject frequencies: count occupied student-slots by normalized subject prefix
          subjects=collections.Counter()
          for x in schedules:
              for d in days:
                  for pair,sub,room in x['days'][d]['detail']:
                      base=sub.split(' / ')[0].strip()
                      subjects[base]+=1
          print('=== SUBJECT_SLOT_COUNTS ===')
          for k,v in subjects.most_common(): print(v,k)
          PY
