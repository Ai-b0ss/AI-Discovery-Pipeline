name: tmp-source-inspect-20260828

on:
  push:
    branches:
      - tmp/yandex-drive-transfer-20260828
    paths:
      - tmp-source-inspect-trigger.txt

permissions:
  contents: read

jobs:
  wfolio-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Request original-size Wfolio project archive
        env:
          BASE: https://olyashevchuk88.wfolio.pro
          PROJECT: /disk/soho-30-06-2026-terrasa-wm28ks
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/146 Safari/537.36'
          curl -L --fail --retry 3 -A "$UA" -c cookies.txt -b cookies.txt "$BASE$PROJECT" -o page.html
          curl -L --fail --retry 3 -A "$UA" -c cookies.txt -b cookies.txt \
            -H 'Turbo-Frame: modal' -H 'Accept: text/vnd.turbo-stream.html, text/html, application/xhtml+xml' \
            "$BASE$PROJECT/downloads/project" -o download-project.html
          TOKEN=$(python - <<'PY'
          from bs4 import BeautifulSoup
          s=BeautifulSoup(open('download-project.html',encoding='utf-8'),'html.parser')
          f=next(f for f in s.find_all('form') if f.find('button',attrs={'name':'storage','value':'local'}))
          print(f.find('input',attrs={'name':'authenticity_token'})['value'])
          PY
          )
          curl --fail --retry 3 -A "$UA" -c cookies.txt -b cookies.txt \
            -H "Referer: $BASE$PROJECT" \
            -H 'Accept: text/vnd.turbo-stream.html, text/html, application/xhtml+xml' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "authenticity_token=$TOKEN" \
            --data-urlencode 'scope=project' \
            --data-urlencode 'folder_path=' \
            --data-urlencode 'size=original' \
            --data-urlencode 'cart_secure_id=' \
            --data-urlencode 'person_id=' \
            --data-urlencode 'storage=local' \
            -D post-headers.txt -o post-body.html \
            "$BASE$PROJECT/downloads/project"
          echo '--- POST HEADERS ---'
          cat post-headers.txt
          echo '--- POST BODY ---'
          head -c 100000 post-body.html
          echo
          python - <<'PY'
          import re,html,json
          s=open('post-body.html',encoding='utf-8',errors='replace').read()
          vals=[]
          for m in re.findall(r'(?:https?://[^"\'<> ]+|/[^"\'<> ]*(?:download|archive|zip|storage|file)[^"\'<> ]*)',s,re.I):
              m=html.unescape(m).replace('\\/','/')
              if m not in vals: vals.append(m)
          print('CANDIDATES')
          for x in vals[:200]: print(x)
          PY
      - name: Save archive-request response
        uses: actions/upload-artifact@v7
        with:
          name: wfolio-archive-request
          path: |
            post-headers.txt
            post-body.html
            cookies.txt
          compression-level: 9
          retention-days: 1
