name: tmp-source-inspect-20260828

on:
  push:
    branches:
      - tmp/yandex-drive-transfer-20260828
    paths:
      - tmp-source-inspect-trigger.txt

permissions:
  contents: read

jobs:
  inspect-wfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Wfolio download and pieces endpoints
        env:
          BASE: https://olyashevchuk88.wfolio.pro
          PROJECT: /disk/soho-30-06-2026-terrasa-wm28ks
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/146 Safari/537.36'
          curl -L --fail --retry 3 -A "$UA" -c cookies.txt -b cookies.txt "$BASE$PROJECT" -o page.html
          curl -L --fail --retry 3 -A "$UA" -c cookies.txt -b cookies.txt \
            -H 'Turbo-Frame: modal' -H 'Accept: text/vnd.turbo-stream.html, text/html, application/xhtml+xml' \
            "$BASE$PROJECT/downloads/project" -D download-headers.txt -o download-project.html
          curl -L --fail --retry 3 -A "$UA" -c cookies.txt -b cookies.txt \
            "$BASE$PROJECT/pieces?design_variant=storyboard&folder_path=photos" -D pieces-headers.txt -o pieces.html
          JS='/assets/disk.application-5a392d20bf11aead8ce690a436871ddd2449c3d702cd8f3c5e8c1e8991c244c5.js'
          curl -L --fail --retry 3 -A "$UA" "$BASE$JS" -o disk.js

          python - <<'PY'
          import re, json, html, os
          for fn in ['download-project.html','pieces.html','disk.js']:
              s=open(fn,encoding='utf-8',errors='replace').read()
              print('\n###',fn,'bytes',len(s.encode()))
              patterns=[r'<form[^>]+>',r'action="[^"]+"',r'href="[^"]+"',r'data-[\w-]+="[^"]+"',r'https?://[^"\'<>\\ ]+',r'/disk/[^"\'<> ]+']
              seen=[]
              for pat in patterns:
                  for m in re.findall(pat,s,re.I):
                      m=html.unescape(m).replace('\\/','/')
                      if m not in seen and any(k in m.lower() for k in ['download','original','preview','piece','google','yandex','archive','zip','file','photo','folder']):
                          seen.append(m)
              for x in seen[:500]: print(x[:2000])
              if fn=='pieces.html':
                  print('img-ish count',len(re.findall(r'<(?:img|picture|source)\b',s,re.I)))
                  print('piece ids',len(set(re.findall(r'(?:piece|photo)[_-]?(\d+)',s,re.I))))
          PY

      - name: Package Wfolio inspection
        uses: actions/upload-artifact@v7
        with:
          name: wfolio-download-inspection
          path: |
            download-project.html
            download-headers.txt
            pieces.html
            pieces-headers.txt
            disk.js
          compression-level: 9
          retention-days: 1
