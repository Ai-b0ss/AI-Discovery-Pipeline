name: tmp-source-inspect-20260828

on:
  push:
    branches:
      - tmp/yandex-drive-transfer-20260828
    paths:
      - tmp-source-inspect-trigger.txt

permissions:
  contents: read

jobs:
  wfolio-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Request original-size Wfolio project archive and probe ranges
        env:
          BASE: https://olyashevchuk88.wfolio.pro
          PROJECT: /disk/soho-30-06-2026-terrasa-wm28ks
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/146 Safari/537.36'
          curl -L --fail --retry 3 -A "$UA" -c cookies.txt -b cookies.txt "$BASE$PROJECT" -o page.html
          curl -L --fail --retry 3 -A "$UA" -c cookies.txt -b cookies.txt \
            -H 'Turbo-Frame: modal' -H 'Accept: text/vnd.turbo-stream.html, text/html, application/xhtml+xml' \
            "$BASE$PROJECT/downloads/project" -o download-project.html
          TOKEN=$(python - <<'PY'
          import re, html
          s=open('download-project.html',encoding='utf-8',errors='replace').read()
          forms=re.findall(r'<form\b[^>]*>.*?</form>',s,re.I|re.S)
          local=next((f for f in forms if re.search(r'<button\b[^>]*name=["\']storage["\'][^>]*value=["\']local["\']',f,re.I)),None)
          if not local: raise SystemExit('local-download form not found')
          m=re.search(r'<input\b[^>]*name=["\']authenticity_token["\'][^>]*value=["\']([^"\']+)',local,re.I)
          if not m: m=re.search(r'<input\b[^>]*value=["\']([^"\']+)["\'][^>]*name=["\']authenticity_token["\']',local,re.I)
          if not m: raise SystemExit('authenticity_token not found')
          print(html.unescape(m.group(1)))
          PY
          )
          curl -L --fail --retry 3 -A "$UA" -c cookies.txt -b cookies.txt \
            -H "Referer: $BASE$PROJECT" \
            -H 'Accept: text/vnd.turbo-stream.html, text/html, application/xhtml+xml' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "authenticity_token=$TOKEN" \
            --data-urlencode 'scope=project' \
            --data-urlencode 'folder_path=' \
            --data-urlencode 'size=original' \
            --data-urlencode 'cart_secure_id=' \
            --data-urlencode 'person_id=' \
            --data-urlencode 'storage=local' \
            -o post-body.html "$BASE$PROJECT/downloads/project"
          ARCHIVE=$(python - <<'PY'
          import re,html
          s=open('post-body.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'target=["\'](https?://[^"\']+)["\']',s,re.I)
          if not m: raise SystemExit('archive URL not found')
          print(html.unescape(m.group(1)))
          PY
          )
          echo "ARCHIVE_URL=$ARCHIVE"
          echo '--- HEAD ---'
          curl -sSIL --retry 2 -A "$UA" "$ARCHIVE" | tee archive-head.txt
          echo '--- RANGE 0-1048575 ---'
          set +e
          curl -sSL --retry 2 -A "$UA" -H 'Range: bytes=0-1048575' --max-filesize 2000000 \
            -D range-headers.txt -o range-sample.bin -w 'HTTP=%{http_code} SIZE=%{size_download} URL=%{url_effective}\n' "$ARCHIVE"
          rc=$?
          set -e
          echo "RANGE_RC=$rc"
          cat range-headers.txt || true
          wc -c range-sample.bin || true
      - name: Save range probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wfolio-range-probe
          path: |
            post-body.html
            archive-head.txt
            range-headers.txt
            range-sample.bin
          compression-level: 9
          retention-days: 1
          if-no-files-found: warn
