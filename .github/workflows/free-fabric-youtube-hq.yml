      - name: Upload chunk 16
        uses: actions/upload-artifact@v4
        with: {name: youtube-BUN1qw0yH6M-1440p-chunk-16, path: out/chunks/chunk-16, if-no-files-found: ignore, compression-level: 0, retention-days: 1}
      - name: Upload chunk 17
        uses: actions/upload-artifact@v4
        with: {name: youtube-BUN1qw0yH6M-1440p-chunk-17, path: out/chunks/chunk-17, if-no-files-found: ignore, compression-level: 0, retention-days: 1}
      - name: Upload chunk 18
