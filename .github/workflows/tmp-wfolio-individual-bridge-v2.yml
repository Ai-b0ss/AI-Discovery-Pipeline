name: tmp-wfolio-individual-bridge-v2

on:
  push:
    branches: [tmp/yandex-drive-transfer-20260828]
    paths: [tmp-wfolio-individual-control-v2.json]

permissions:
  contents: read
  actions: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: extract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl out
          jq -r '.[].artifact_id' tmp-wfolio-individual-control-v2.json | sort -u | while read -r id; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "dl/$id.bin"
            test -s "dl/$id.bin"
          done
          python - <<'PY'
          import json,zipfile,hashlib,os,io
          items=json.load(open('tmp-wfolio-individual-control-v2.json',encoding='utf-8'))
          if not (1 <= len(items) <= 20): raise SystemExit('control must contain 1..20 items')
          cache={}
          def source_zip(aid):
              if aid in cache: return cache[aid]
              p=f'dl/{aid}.bin'
              outer=zipfile.ZipFile(p)
              files=[i for i in outer.infolist() if not i.is_dir()]
              if any(i.filename.lower().endswith(('.jpg','.jpeg')) for i in files):
                  cache[aid]=outer; return outer
              if len(files)==1:
                  data=outer.read(files[0])
                  inner=zipfile.ZipFile(io.BytesIO(data))
                  cache[aid]=inner; return inner
              raise SystemExit(f'cannot identify payload structure for artifact {aid}: {[i.filename for i in files[:5]]}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as gh:
              for n,item in enumerate(items,1):
                  aid=str(item['artifact_id']); base=item['name']; want=item['sha256']; idx=int(item['index'])
                  z=source_zip(aid)
                  hits=[i for i in z.infolist() if not i.is_dir() and os.path.basename(i.filename)==base]
                  if len(hits)!=1: raise SystemExit(f'{base}: matches={len(hits)} in {aid}')
                  data=z.read(hits[0]); got=hashlib.sha256(data).hexdigest()
                  if got!=want: raise SystemExit(f'SHA mismatch {base}: {got} != {want}')
                  path=f'out/{base}'; open(path,'wb').write(data)
                  slot=f'{n:02d}'
                  gh.write(f'name{slot}=wf{idx:04d}-{base}\n')
                  gh.write(f'path{slot}={path}\n')
                  print('OK',idx,base,len(data),got)
          PY
      - if: steps.extract.outputs.name01 != ''
        uses: actions/upload-artifact@v7
        with: {name: '${{ steps.extract.outputs.name01 }}', path: '${{ steps.extract.outputs.path01 }}', archive: false, retention-days: 7}
      - if: steps.extract.outputs.name02 != ''
