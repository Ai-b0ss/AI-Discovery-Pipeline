name: TEMP MISIS schedule extractor

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Analyse official ITKN schedule precisely
        shell: bash
        run: |
          set -euo pipefail
          URL='https://misis.ru/files/-/504f0d5daceff524b3076082666fa485/itkn-260826.xls'
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0 Chrome/140 Safari/537.36' "$URL" -o /tmp/itkn.xls
          python3 -m pip install -q --disable-pip-version-check xlrd==2.0.1
          python3 - <<'PY'
          import re, xlrd
          book=xlrd.open_workbook('/tmp/itkn.xls', formatting_info=True)
          sh=book.sheet_by_name('1 курс')

          def t(r,c):
              v=sh.cell_value(r,c)
              if v is None: return ''
              if isinstance(v,float) and v.is_integer(): return str(int(v))
              return str(v).replace('\r',' ').replace('\n',' / ').strip()

          groups=[]
          for c in range(sh.ncols):
              s=t(0,c)
              if re.fullmatch(r'ББИ-26-6-[1-7]',s): groups.append((s,c))
          print('GROUP_COLUMNS', [(g,c+1) for g,c in groups])
          assert len(groups)==7, groups

          days=[('Пн',2),('Вт',16),('Ср',30),('Чт',44),('Пт',58),('Сб',72),('Вс',86)]
          times=['09:00','10:50','12:40','14:30','16:20','18:00','19:35']

          def entry(base,row):
              parts=[]
              for cc in (base,base+2):
                  s=t(row,cc)
                  if s:
                      room=t(row,cc+1)
                      parts.append(s + (f' @ {room}' if room else ''))
              return ' | '.join(parts)

          print('=== EXACT EARLIEST BY TWO ALTERNATING ROWS ===')
          counts={g:{'A09':0,'B09':0,'A_days':0,'B_days':0} for g,_ in groups}
          for g,base in groups:
              print('GROUP',g)
              for day,start in days:
                  ea=eb=None; da=db=''
                  for p in range(7):
                      ra=start+2*p; rb=ra+1
                      va=entry(base,ra); vb=entry(base,rb)
                      if va and ea is None: ea=p; da=va
                      if vb and eb is None: eb=p; db=vb
                  sa='—' if ea is None else times[ea]
                  sb='—' if eb is None else times[eb]
                  if ea is not None: counts[g]['A_days']+=1
                  if eb is not None: counts[g]['B_days']+=1
                  if ea==0: counts[g]['A09']+=1
                  if eb==0: counts[g]['B09']+=1
                  print(f'{day}: A={sa} :: {da[:180]} || B={sb} :: {db[:180]}')
              print('COUNTS',counts[g])

          print('=== FULL START MATRIX ===')
          print('group\tday\tA\tB\tunion')
          for g,base in groups:
              for day,start in days:
                  es=[]
                  for offset in (0,1):
                      e=None
                      for p in range(7):
                          if entry(base,start+2*p+offset): e=p; break
                      es.append(e)
                  vals=[e for e in es if e is not None]
                  union=min(vals) if vals else None
                  fmt=lambda e:'—' if e is None else times[e]
                  print(f'{g}\t{day}\t{fmt(es[0])}\t{fmt(es[1])}\t{fmt(union)}')

          print('=== WEEK/PARITY LEGEND SEARCH ===')
          rx=re.compile(r'числ|знам|верхн|нижн|ч[её]тн|неч[её]тн|недел',re.I)
          found=[]
          for sheet in book.sheets():
              for r in range(sheet.nrows):
                  for c in range(sheet.ncols):
                      s=str(sheet.cell_value(r,c)).strip()
                      if s and rx.search(s): found.append((sheet.name,r+1,c+1,s))
          for x in found[:100]: print(x)
          print('LEGEND_MATCH_COUNT',len(found))

          print('=== ROW STYLE/HEIGHT DIAGNOSTIC ===')
          # Compare A/B row formatting for Monday through Friday at time and group columns.
          for day,start in days[:5]:
              for off,label in ((0,'A'),(1,'B')):
                  r=start+off
                  xf_time=sh.cell_xf_index(r,2)
                  xf_group=sh.cell_xf_index(r,groups[0][1])
                  x=book.xf_list[xf_time]
                  bg=x.background
                  ri=sh.rowinfo_map.get(r)
                  print(day,label,'row',r+1,'xf_time',xf_time,'xf_group',xf_group,
                        'fill',getattr(bg,'fill_pattern',None),
                        'pattern_color',getattr(bg,'pattern_colour_index',None),
                        'background_color',getattr(bg,'background_colour_index',None),
                        'height',getattr(ri,'height',None),'hidden',getattr(ri,'hidden',None))

          print('=== MERGES NEAR HEADER/FIRST DAY ===')
          for m in sh.merged_cells:
              rlo,rhi,clo,chi=m
              if rlo < 17 and clo < 32: print(tuple(v+1 for v in (rlo,rhi-1,clo,chi-1)))
          PY
