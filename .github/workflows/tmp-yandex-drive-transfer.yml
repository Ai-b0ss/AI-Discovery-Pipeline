name: tmp-yandex-drive-transfer

on:
  push:
    branches:
      - tmp/yandex-drive-transfer-20260828

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect Yandex public folder
        env:
          PUBLIC_KEY: https://disk.yandex.ru/d/GedxLT7sVZldWw
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          PUBLIC_KEY = os.environ['PUBLIC_KEY']
          API = 'https://cloud-api.yandex.net/v1/disk/public/resources'

          def api(params, attempts=5):
              url = API + '?' + urllib.parse.urlencode(params)
              last = None
              for i in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          if r.status != 200:
                              raise RuntimeError(f'HTTP {r.status}')
                          return json.load(r)
                  except Exception as e:
                      last = e
                      if i + 1 < attempts:
                          time.sleep(min(16, 2 ** i))
              raise last

          files = []
          dirs = []
          stack = ['/']
          seen = set()

          while stack:
              path = stack.pop()
              if path in seen:
                  continue
              seen.add(path)
              dirs.append(path)
              offset = 0
              while True:
                  data = api({
                      'public_key': PUBLIC_KEY,
                      'path': path,
                      'limit': 1000,
                      'offset': offset,
                  })
                  emb = data.get('_embedded') or {}
                  items = emb.get('items') or []
                  for item in items:
                      t = item.get('type')
                      p = item.get('path')
                      if t == 'dir' and p:
                          stack.append(p)
                      elif t == 'file':
                          files.append({
                              'name': item.get('name'),
                              'path': p,
                              'size': int(item.get('size') or 0),
                              'mime_type': item.get('mime_type'),
                          })
                  total = int(emb.get('total') or len(items))
                  offset += len(items)
                  if not items or offset >= total:
                      break

          total_bytes = sum(x['size'] for x in files)
          by_top = {}
          for x in files:
              p = (x.get('path') or '').replace('disk:', '').lstrip('/')
              top = p.split('/', 1)[0] if p else '(root)'
              row = by_top.setdefault(top, {'files': 0, 'bytes': 0})
              row['files'] += 1
              row['bytes'] += x['size']

          summary = {
              'public_key': PUBLIC_KEY,
              'file_count': len(files),
              'dir_count': len(dirs),
              'total_bytes': total_bytes,
              'total_gib': round(total_bytes / (1024**3), 4),
              'by_top_level': by_top,
              'largest_files': sorted(files, key=lambda x: x['size'], reverse=True)[:50],
              'files': files,
          }
          with open('yandex-summary.json', 'w', encoding='utf-8') as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)

          print(f'YANDEX_FILE_COUNT={len(files)}')
          print(f'YANDEX_DIR_COUNT={len(dirs)}')
          print(f'YANDEX_TOTAL_BYTES={total_bytes}')
          print(f'YANDEX_TOTAL_GIB={total_bytes / (1024**3):.4f}')
          print('TOP_LEVEL=' + json.dumps(by_top, ensure_ascii=False))
          print('LARGEST:')
          for x in summary['largest_files'][:15]:
              print(f"{x['size']}\t{x.get('path')}")
          PY

      - name: Upload inspection summary
        uses: actions/upload-artifact@v4
        with:
          name: yandex-inspection
          path: yandex-summary.json
          retention-days: 1
          compression-level: 9
