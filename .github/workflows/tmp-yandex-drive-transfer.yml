name: tmp-yandex-drive-transfer

on:
  push:
    branches:
      - tmp/yandex-drive-transfer-20260828
    paths:
      - tmp-yandex-control.json

permissions:
  contents: read
  actions: write

jobs:
  raw-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Delete previous raw bridge artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "bridge-test.txt") | .id' \
          | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
      - name: Create exact test file
        run: printf 'RAW-BRIDGE-TEST-123\n' > bridge-test.txt
      - name: Upload without archive
        uses: actions/upload-artifact@v7
        with:
          path: bridge-test.txt
          archive: false
          retention-days: 1
          if-no-files-found: error
