name: tmp-yandex-drive-transfer

on:
  push:
    branches:
      - tmp/yandex-drive-transfer-20260828
    paths:
      - tmp-yandex-control.json

permissions:
  contents: read
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Build exact byte-range plan
        run: |
          python - <<'PY'
          import json, math, os
          c=json.load(open('tmp-yandex-control.json',encoding='utf-8'))
          total=int(c['expected_size'])
          chunk=int(c.get('chunk_size',500_000_000))
          if chunk <= 0 or chunk > 520_000_000:
              raise SystemExit('chunk_size must be in 1..520000000')
          n=math.ceil(total/chunk)
          first=int(c.get('first_part',1))
          count=int(c.get('count',n-first+1))
          if first < 1 or first > n:
              raise SystemExit(f'first_part must be in 1..{n}')
          if count <= 0:
              raise SystemExit('count must be positive')
          last=min(n,first+count-1)
          parts=[]
          for part_num in range(first,last+1):
              i=part_num-1
              start=i*chunk
              end=min(total-1,(i+1)*chunk-1)
              parts.append({
                  'part':part_num,
                  'start':start,
                  'end':end,
                  'size':end-start+1,
                  'name':f"payload.part{part_num:03d}",
              })
          matrix=json.dumps({'include':parts},separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('matrix='+matrix+'\n')
          print(json.dumps({'total_parts':n,'requested_first':first,'requested_last':last,'parts':parts},indent=2))
          PY
      - name: Delete obsolete temporary payload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "payload.mp4" or (.name | startswith("payload.part"))) | .id' \
          | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done

  part:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download exact source byte range
        env:
          PART_START: ${{ matrix.start }}
          PART_END: ${{ matrix.end }}
          PART_SIZE: ${{ matrix.size }}
          PART_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, time, urllib.parse, urllib.request
          c=json.load(open('tmp-yandex-control.json',encoding='utf-8'))
          start=int(os.environ['PART_START']); end=int(os.environ['PART_END']); expected=int(os.environ['PART_SIZE'])
          name=os.environ['PART_NAME']
          api='https://cloud-api.yandex.net/v1/disk/public/resources/download?'+urllib.parse.urlencode({
              'public_key':c['public_key'],'path':c['path']})
          last=None
          for attempt in range(6):
              try:
                  req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      href=json.load(r)['href']
                  req=urllib.request.Request(href,headers={
                      'User-Agent':'Mozilla/5.0','Range':f'bytes={start}-{end}','Accept-Encoding':'identity'})
                  h=hashlib.sha256(); nbytes=0
                  with urllib.request.urlopen(req,timeout=300) as r, open(name,'wb') as f:
                      status=getattr(r,'status',None); cr=r.headers.get('Content-Range')
                      while True:
                          b=r.read(8*1024*1024)
                          if not b: break
                          f.write(b); h.update(b); nbytes+=len(b)
                  if nbytes != expected:
                      raise RuntimeError(f'bad range size expected={expected} actual={nbytes} status={status} content-range={cr!r}')
                  print(f'PART_OK name={name} start={start} end={end} bytes={nbytes} sha256={h.hexdigest()}')
                  break
              except Exception as e:
                  last=e
                  try: os.remove(name)
                  except FileNotFoundError: pass
                  if attempt==5: raise
                  time.sleep(min(30,2**attempt))
          PY
      - name: Upload raw volume without ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.name }}
          archive: false
          retention-days: 1
          if-no-files-found: error
