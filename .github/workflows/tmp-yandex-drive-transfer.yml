name: tmp-yandex-drive-transfer

on:
  push:
    branches:
      - tmp/yandex-drive-transfer-20260828
    paths:
      - tmp-yandex-control.json

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Delete previous raw payload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "payload.mp4") | .id' \
          | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done

      - name: Download complete file with resume and verify
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, time, urllib.parse, urllib.request

          c = json.load(open('tmp-yandex-control.json', encoding='utf-8'))
          public_key = c['public_key']
          path = c['path']
          expected = int(c['expected_size'])
          out = 'payload.mp4'

          def signed_url():
              api = 'https://cloud-api.yandex.net/v1/disk/public/resources/download?' + urllib.parse.urlencode({
                  'public_key': public_key,
                  'path': path,
              })
              req = urllib.request.Request(api, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)['href']

          for attempt in range(10):
              current = os.path.getsize(out) if os.path.exists(out) else 0
              if current == expected:
                  break
              if current > expected:
                  raise RuntimeError(f'local file exceeded expected size: {current} > {expected}')
              href = signed_url()
              cmd = [
                  'curl', '--fail', '--location', '--retry', '5', '--retry-all-errors',
                  '--retry-delay', '2', '--connect-timeout', '30', '--speed-time', '120', '--speed-limit', '1024',
                  '-H', 'Accept-Encoding: identity',
              ]
              if current:
                  cmd += ['--range', f'{current}-', '--output', 'resume.bin', href]
              else:
                  cmd += ['--output', out, href]
              try:
                  subprocess.run(cmd, check=True)
                  if current:
                      with open(out, 'ab') as dst, open('resume.bin', 'rb') as src:
                          while True:
                              b = src.read(16 * 1024 * 1024)
                              if not b:
                                  break
                              dst.write(b)
                      os.remove('resume.bin')
              except subprocess.CalledProcessError:
                  try:
                      os.remove('resume.bin')
                  except FileNotFoundError:
                      pass
                  if attempt == 9:
                      raise
                  time.sleep(min(30, 2 ** attempt))

          actual = os.path.getsize(out)
          if actual != expected:
              raise RuntimeError(f'final size mismatch: expected={expected}, actual={actual}')

          h = hashlib.sha256()
          with open(out, 'rb') as f:
              for b in iter(lambda: f.read(16 * 1024 * 1024), b''):
                  h.update(b)
          digest = h.hexdigest()
          print(f'EXPECTED_SIZE={expected}')
          print(f'ACTUAL_SIZE={actual}')
          print(f'SHA256={digest}')
          print(f'SOURCE_PATH={path}')
          PY

      - name: Validate MP4 header and box structure
        run: |
          python - <<'PY'
          import os, struct
          p='payload.mp4'
          size=os.path.getsize(p)
          with open(p,'rb') as f:
              head=f.read(1024*1024)
          if len(head) < 16 or head[4:8] != b'ftyp':
              raise SystemExit('invalid MP4: ftyp box not found at expected position')
          major=head[8:12].decode('ascii','replace')
          if b'mdat' not in head and b'moov' not in head and size < 1024*1024:
              raise SystemExit('invalid MP4: no media/container boxes visible')
          print(f'MP4_HEADER_OK major_brand={major} size={size}')
          PY

      - name: Upload source bytes without ZIP
        uses: actions/upload-artifact@v7
        with:
          path: payload.mp4
          archive: false
          retention-days: 1
          if-no-files-found: error
