name: tmp-yandex-drive-transfer

on:
  push:
    branches:
      - tmp/yandex-drive-transfer-20260828
    paths:
      - tmp-yandex-control.json

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Delete previous raw payload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "payload.mp4") | .id' \
          | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done

      - name: Download complete Yandex file and verify size
        env:
          PUBLIC_KEY: ${{ fromJSON(format('{0}', toJSON(fromJSON(steps.control.outputs.json)))) }}
        run: echo impossible
