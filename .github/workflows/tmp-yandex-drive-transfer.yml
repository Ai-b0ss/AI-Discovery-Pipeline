name: tmp-yandex-drive-transfer

on:
  push:
    branches:
      - tmp/yandex-drive-transfer-20260828

permissions:
  contents: write

jobs:
  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create tiny release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: tmp-yandex-transfer-test-20260828
        run: |
          set -euo pipefail
          printf 'release-bridge-test\n' > bridge-test.txt
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" bridge-test.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Temporary Yandex transfer test" --notes "Temporary; will be deleted."
