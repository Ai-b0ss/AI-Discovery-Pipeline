name: tmp-misis-compare-260826-310826
on:
  push:
    paths:
      - '.github/workflows/tmp-misis-compare-260826-310826.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Compare official MISIS schedule revisions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q xlrd
          curl -fL -A 'Mozilla/5.0' 'https://misis.ru/files/-/504f0d5daceff524b3076082666fa485/itkn-260826.xls' -o /tmp/old.xls
          curl -fL -A 'Mozilla/5.0' 'https://misis.ru/files/-/61ebbc4e564f18f7ee346813dd2c4c53/itkn-310826.xls' -o /tmp/new.xls
          python - <<'PY'
          import xlrd
          target='ББИ-26-6-2'
          def sheet(path):
              wb=xlrd.open_workbook(path)
              return wb.sheet_by_name('1 курс')
          a,b=sheet('/tmp/old.xls'),sheet('/tmp/new.xls')
          # group starts at column containing target; two subgroup blocks = four cols (subject,room x2)
          def hit(s):
              for c in range(s.ncols):
                  if str(s.cell_value(0,c)).strip()==target: return c
              raise SystemExit('target not found')
          ca,cb=hit(a),hit(b)
          print('GROUP_COLS old/new',ca,cb,'dims',a.nrows,a.ncols,b.nrows,b.ncols)
          print('=== NEW DAY/TIME + GROUP 6-2 ===')
          for r in range(b.nrows):
              vals=[]
              for c in list(range(0,3))+list(range(cb,cb+4)):
                  if c < b.ncols:
                      x=b.cell_value(r,c)
                      if x not in ('',None): vals.append(f'C{c}={x!r}')
              if vals: print(f'R{r}: '+' | '.join(vals))
          print('=== DIFF OLD -> NEW (day/time cols 0:3 + group block) ===')
          maxr=max(a.nrows,b.nrows)
          for r in range(maxr):
              old=[]; new=[]
              for rel in range(4):
                  xa=a.cell_value(r,ca+rel) if r<a.nrows and ca+rel<a.ncols else ''
                  xb=b.cell_value(r,cb+rel) if r<b.nrows and cb+rel<b.ncols else ''
                  old.append(xa); new.append(xb)
              if old!=new:
                  day=''
                  if r<b.nrows:
                      day=' | '.join(str(b.cell_value(r,c)) for c in range(min(3,b.ncols)) if b.cell_value(r,c) not in ('',None))
                  print('R',r,'META',day,'OLD',old,'NEW',new)
          PY
