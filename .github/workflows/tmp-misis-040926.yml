name: tmp-misis-040926
on:
  push:
    paths:
      - '.github/workflows/tmp-misis-040926.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and parse official MISIS XLS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q xlrd
          url='https://misis.ru/files/-/0d429d470d57f677a7770fd4afe00df8/itkn-040926.xls'
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o /tmp/itkn-040926.xls
          file /tmp/itkn-040926.xls
          ls -lh /tmp/itkn-040926.xls
          python - <<'PY'
          import xlrd
          p='/tmp/itkn-040926.xls'
          wb=xlrd.open_workbook(p, formatting_info=False)
          print('SHEETS', wb.sheet_names())
          target='ББИ-26-6-2'
          for s in wb.sheets():
              hits=[]
              for r in range(s.nrows):
                  for c in range(s.ncols):
                      v=s.cell_value(r,c)
                      if isinstance(v,str) and target in v:
                          hits.append((r,c,v))
              if hits:
                  print('=== SHEET',s.name,'HITS',hits,'===')
                  for r,c,v in hits:
                      r0=max(0,r-12); r1=min(s.nrows,r+130)
                      c0=max(0,c-8); c1=min(s.ncols,c+12)
                      print('--- CONTEXT',r0,r1,c0,c1,'---')
                      for rr in range(r0,r1):
                          vals=[]
                          for cc in range(c0,c1):
                              x=s.cell_value(rr,cc)
                              if x not in ('',None): vals.append(f'C{cc}={x!r}')
                          if vals: print(f'R{rr}: '+' | '.join(vals))
          PY
